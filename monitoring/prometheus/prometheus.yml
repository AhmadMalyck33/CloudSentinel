
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "cloudsentinel-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cloudsentinel-api:5000"]

  - job_name: "docker-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["docker-exporter:9323"]
