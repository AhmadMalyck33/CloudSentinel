
name: CloudSentinel CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  test:
    name: Run Backend Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: |
          python -m pytest -v


  security:
    name: Python Security Scanning
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Scan Python Code with Bandit
        run: |
          bandit -r app -ll

      - name: Audit Python Dependencies
        run: |
          pip-audit -r requirements.txt


  docker-build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-24.04
    needs: [test, security]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build -t cloudsentinel-api:latest .

      - name: Smoke Test Docker Image
        run: |
          set -e
          container_id=$(docker run -d -p 5000:5000 cloudsentinel-api:latest)
          trap 'docker stop "$container_id" >/dev/null' EXIT

          for attempt in $(seq 1 30); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:5000/health)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "Container health check did not return HTTP 200 within 30 seconds."
          exit 1

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudsentinel-api:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
